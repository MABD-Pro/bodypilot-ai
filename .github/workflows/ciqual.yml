name: Ciqual

# Récupère la table Ciqual officielle et la publie en artefact, pour mettre à jour
# le catalogue d'aliments embarqué (scripts/ciqual).
on:
  push:
    paths: ["scripts/ciqual/**", ".github/workflows/ciqual.yml"]
  workflow_dispatch:

jobs:
  fetch:
    name: Télécharger Ciqual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ciqual/fetch.sh ciqual-source
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-source
          path: ciqual-source

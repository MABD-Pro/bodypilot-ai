name: CI

on:
  push:
    branches: [main]
  pull_request:
    # La doc seule ne change ni le package ni l'app.
    paths-ignore: ["**.md", "docs/**"]
  # Relance manuelle (onglet Actions) si GitHub n'a pas déclenché la CI d'une PR.
  workflow_dispatch:

# Un nouveau push sur une PR annule le build précédent, devenu inutile.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: BodyPilotKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: Packages/BodyPilotKit
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  app:
    name: App iOS (XcodeGen + build simulateur)
    runs-on: macos-15
    # Minutes macOS facturées x10 : le build de la PR suffit, la fusion (squash d'une
    # branche à jour) produit le même code. Après fusion, seul le package est revérifié.
    if: github.event_name != 'push'
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      # Modules du SDK précompilés : identiques d'un build à l'autre pour une même version de Xcode.
      - uses: actions/cache@v4
        with:
          path: build/ModuleCache.noindex
          key: modulecache-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Packages/BodyPilotKit/Package.swift') }}
          restore-keys: modulecache-${{ steps.xcode.outputs.version }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build simulateur et captures d'écran
        run: scripts/ci-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: screenshots/
          if-no-files-found: ignore
      # Copie des captures sur une branche dédiée, lisible sans télécharger d'artefact
      # (aperçus de design dans les PR et pour les agents sans accès aux artefacts).
      - name: Publier les captures sur la branche ci/captures
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: screenshots
        run: |
          for f in *.png; do sips -s format jpeg -s formatOptions 80 "$f" --out "${f%.png}.jpg" > /dev/null; done
          rm -f *.png
          echo "Captures de ${{ github.event.pull_request.head.sha }} (PR #${{ github.event.pull_request.number }})" > README.md
          git init -q -b ci/captures
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Captures PR #${{ github.event.pull_request.number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci/captures

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: BodyPilotKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: Packages/BodyPilotKit
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  app:
    name: App iOS (XcodeGen + build simulateur)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project BodyPilot.xcodeproj
          -scheme BodyPilot
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

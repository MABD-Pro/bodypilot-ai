name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: BodyPilotKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: Packages/BodyPilotKit
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

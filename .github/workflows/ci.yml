name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: BodyPilotKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: Packages/BodyPilotKit
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  app:
    name: App iOS (XcodeGen + build simulateur)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build simulateur et captures d'écran
        run: scripts/ci-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: screenshots/
          if-no-files-found: ignore

# Génère BodyPilot.xcodeproj : `xcodegen generate` (le .xcodeproj n'est pas versionné).
name: BodyPilot
options:
  bundleIdPrefix: com.mabdpro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2GR4X5995G

packages:
  BodyPilotKit:
    path: Packages/BodyPilotKit
  # Crashlytics et Analytics, éteints tant que l'utilisateur n'a pas accepté (voir docs/TELEMETRY.md).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.1.0

targets:
  BodyPilot:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        NSHealthShareUsageDescription: BodyPilot lit ton poids, ton taux de gras et ta masse maigre, ta taille, ta date de naissance, ton sexe, tes entraînements (avec leur parcours et ton pouls), ton sommeil, ta forme cardio, ton pouls au repos et, si tu le notes, ton cycle menstruel dans Santé pour suivre ta tendance et te proposer la bonne séance du jour sans saisie. Rien ne quitte ton iPhone.
        NSHealthUpdateUsageDescription: BodyPilot enregistre dans Santé les repas que tu as mangés (calories, protéines, glucides, lipides). Rien ne quitte ton iPhone.
        # Firebase : rien n'est collecté avant le consentement, jamais de publicité ni d'identifiant.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseAppDelegateProxyEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        NSCameraUsageDescription: BodyPilot photographie ton repas pour estimer ce que tu as mangé, et peut mesurer ton tour de taille au LiDAR si tu le demandes. Les images sont analysées sur ton iPhone et ne sont pas conservées.
    entitlements:
      path: App/BodyPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: BodyPilotKit
        product: BodyPilotCore
      - package: BodyPilotKit
        product: AIRouter
      - package: BodyPilotKit
        product: Nutrition
      - package: BodyPilotKit
        product: Training
      - package: BodyPilotKit
        product: ProgressInsights
      - package: BodyPilotKit
        product: Coach
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalyticsCore
    # GoogleService-Info.plist n'est pas versionné : copié s'il est là, sinon Firebase reste éteint.
    postBuildScripts:
      - name: Copier GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/App/Config/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            cp "$PLIST" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          else
            echo "GoogleService-Info.plist absent : Firebase éteint dans ce build."
          fi
      - name: Crashlytics (envoi des symboles)
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
        script: |
          PLIST="${SRCROOT}/App/Config/GoogleService-Info.plist"
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          [ -f "$PLIST" ] && [ -x "$RUN" ] || exit 0
          [ "$PLATFORM_NAME" = "iphonesimulator" ] && exit 0
          "$RUN" -gsp "$PLIST"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mabdpro.bodypilot
        PRODUCT_NAME: BodyPilot
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BodyPilot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # Symboles des plantages pour Crashlytics, aussi pour les builds lancés depuis Xcode.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Les scripts lisent le plist et le dossier SourcePackages, hors de leurs entrées déclarées.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  BodyPilot:
    build:
      targets:
        BodyPilot: all
